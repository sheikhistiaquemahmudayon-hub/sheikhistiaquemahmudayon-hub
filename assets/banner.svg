<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B15" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <linearGradient id="cyanBlueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <linearGradient id="bottomBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.2" />
    </linearGradient>

    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1E293B" stroke-width="0.75" stroke-opacity="0.4" />
    </pattern>
  </defs>

  <!-- Container Base -->
  <rect width="800" height="200" rx="12" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="1" />
  
  <!-- Subtle Grid Texture -->
  <rect width="800" height="198" rx="12" fill="url(#grid)" />

  <!-- Logo Section (Avraan Shield & Monogram) -->
  <g transform="translate(48, 40)">
    <!-- Hexagonal Shield -->
    <polygon points="60,10 105,35 105,85 60,110 15,85 15,35" fill="#141E33" stroke="url(#cyanBlueGrad)" stroke-width="2" />
    <polygon points="60,18 97,39 97,81 60,102 23,81 23,39" fill="none" stroke="#1E3A8A" stroke-width="1" stroke-opacity="0.5" />
    
    <!-- Geometric 'A' Monogram -->
    <path d="M60 36 L80 82 H69 L63 67 H57 L51 82 H40 Z M60 52 L54 67 H66 Z" fill="url(#cyanBlueGrad)" />
  </g>

  <!-- Content Section -->
  <g transform="translate(185, 0)">
    <!-- Name Title -->
    <text x="0" y="76" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#F8FAFC" letter-spacing="0.3">Sheikh Istiaque Mahmud Ayon</text>
    
    <!-- Subtitle / Role -->
    <text x="0" y="105" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#38BDF8" letter-spacing="0.2">Founder &amp; Lead Engineer at Avraan</text>
    
    <!-- Technical Focus -->
    <text x="0" y="136" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#94A3B8" letter-spacing="0.1">Mobile Security Systems • AI Engineering • Distributed Infrastructure</text>
  </g>

  <!-- Accent Status Line -->
  <rect x="0" y="196" width="800" height="4" rx="2" fill="url(#bottomBorder)" />
</svg>
