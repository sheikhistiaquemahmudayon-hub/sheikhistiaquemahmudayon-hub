<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="100%">
  <defs>
    <!-- Background Base Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070C18" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Official Avraan Logo Gradient (Cyan to Electric Blue & Purple) -->
    <linearGradient id="avraanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>

    <!-- Logo Radial Background Glow -->
    <radialGradient id="logoGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#070C18" stop-opacity="0" />
    </radialGradient>

    <!-- Extremely Subtle Bottom Line Accent -->
    <linearGradient id="bottomAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0" />
      <stop offset="20%" stop-color="#00F2FE" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="0.5" />
      <stop offset="80%" stop-color="#8B5CF6" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0" />
    </linearGradient>

    <!-- Subtle Grid Texture -->
    <pattern id="subtleGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1E293B" stroke-width="0.75" stroke-opacity="0.15" />
    </pattern>

    <!-- Official Avraan Hexagon Vector Logo (Matching User Screenshot) -->
    <g id="avraan-official-logo">
      <!-- Clean Hexagon Outline -->
      <polygon points="45,5 82,26 82,68 45,89 8,68 8,26" fill="#0D1527" stroke="url(#avraanGrad)" stroke-width="2" stroke-linejoin="round" />
      
      <!-- Crescent Orbital Swoosh (Left Curve & Right Piercing Tail) -->
      <path d="M 27 30 C 18 38, 19 56, 30 60 C 23 54, 24 42, 33 37 C 43 32, 54 48, 73 34 C 57 48, 41 57, 30 54 C 23 52, 22 40, 27 30 Z" fill="url(#avraanGrad)" opacity="0.9" />

      <!-- Bold Geometric 'A' Monogram -->
      <path d="M 45 22 L 64 66 H 53 L 49 54 H 41 L 37 66 H 26 Z M 45 34 L 43 45 H 47 Z" fill="url(#avraanGrad)" />
    </g>
  </defs>

  <style>
    .text-name {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.4px;
      fill: #F8FAFC;
    }
    .text-role {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.1px;
      fill: #38BDF8;
    }
    .text-focus {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
      font-weight: 400;
      letter-spacing: 0.1px;
      fill: #94A3B8;
    }
  </style>

  <!-- Outer Card Container -->
  <rect width="800" height="200" rx="18" fill="url(#bgGrad)" stroke="#1E293B" stroke-opacity="0.6" stroke-width="1" />
  <rect width="800" height="198" rx="18" fill="url(#subtleGrid)" />

  <!-- Logo Background Subtle Glow -->
  <circle cx="95" cy="97" r="75" fill="url(#logoGlow)" />

  <!-- Logo Group -->
  <g transform="translate(50, 50)">
    <use href="#avraan-official-logo" />
  </g>

  <!-- Typography Content Block -->
  <g transform="translate(172, 0)">
    <text x="0" y="74" class="text-name">Sheikh Istiaque Mahmud Ayon</text>
    <text x="0" y="103" class="text-role">Founder &amp; CEO · Avraan</text>
    <text x="0" y="132" class="text-focus">Mobile Security • AI Integration • Flutter Architecture</text>
  </g>

  <!-- Extremely Subtle Bottom Line Accent -->
  <rect x="60" y="196.5" width="680" height="1.5" rx="0.75" fill="url(#bottomAccent)" />
</svg>
