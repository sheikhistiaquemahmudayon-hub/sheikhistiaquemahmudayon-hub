<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 370" width="100%" height="100%">
  <style>
    .bg { fill: #18181A; stroke: #2E2E32; stroke-width: 1; }
    .header-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 600; fill: #E5E7EB; }
    .term-text { font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', Consolas, monospace; font-size: 14px; }
    .prompt { fill: #8B949E; font-weight: 500; }
    .cmd { fill: #A78BFA; font-weight: 500; }
    .output { fill: #E5E7EB; font-weight: 400; }
    .cursor { fill: #E5E7EB; opacity: 0.8; }
  </style>

  <rect width="800" height="370" rx="14" class="bg" />

  <!-- Window Header Icon: </> Bash -->
  <g transform="translate(28, 22)">
    <path d="M 4 8 L 0 12 L 4 16 M 12 8 L 16 12 L 12 16 M 10 6 L 6 18" fill="none" stroke="#9CA3AF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    <text x="24" y="16" class="header-text">Bash</text>
  </g>

  <!-- Copy Icon -->
  <g transform="translate(744, 22)">
    <rect x="0" y="4" width="13" height="13" rx="2.5" fill="none" stroke="#9CA3AF" stroke-width="1.6" />
    <path d="M 4 1 H 14 A 2 2 0 0 1 16 3 V 13" fill="none" stroke="#9CA3AF" stroke-width="1.6" stroke-linecap="round" />
  </g>

  <g class="term-text">
    <!-- whoami -->
    <text x="28" y="75">
      <tspan class="prompt">ayon@avraan:~$ </tspan><tspan class="cmd">whoami</tspan>
    </text>
    <text x="28" y="100" class="output">Sheikh Istiaque Mahmud Ayon</text>

    <!-- project -->
    <text x="28" y="145">
      <tspan class="prompt">ayon@avraan:~$ </tspan><tspan class="cmd">project</tspan>
    </text>
    <text x="28" y="170" class="output">IntrudEye</text>

    <!-- stack -->
    <text x="28" y="215">
      <tspan class="prompt">ayon@avraan:~$ </tspan><tspan class="cmd">stack</tspan>
    </text>
    <text x="28" y="240" class="output">Flutter  •  Dart  •  Kotlin  •  Firebase  •  Python</text>

    <!-- git branch -->
    <text x="28" y="285">
      <tspan class="prompt">ayon@avraan:~$ </tspan><tspan class="cmd">git branch</tspan>
    </text>
    <text x="28" y="310" class="output">* main</text>

    <!-- prompt with cursor -->
    <text x="28" y="355">
      <tspan class="prompt">ayon@avraan:~$ </tspan>
    </text>
    <rect x="156" y="343" width="8" height="16" class="cursor" />
  </g>
</svg>
