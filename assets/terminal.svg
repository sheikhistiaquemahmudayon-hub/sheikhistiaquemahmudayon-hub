  </style>

  <rect width="800" height="210" rx="8" class="bg" />

  <path d="M 0 8 C 0 3.58 3.58 0 8 0 L 792 0 C 796.42 0 800 3.58 800 8 L 800 34 L 0 34 Z" class="bar" />
  <line x1="0" y1="34" x2="800" y2="34" stroke="#30363D" stroke-width="1" />

  <circle cx="18" cy="17" r="5" fill="#FF5F56" />
  <circle cx="34" cy="17" r="5" fill="#FFBD2E" />
  <circle cx="50" cy="17" r="5" fill="#27C93F" />

  <text x="400" y="21" text-anchor="middle" class="title">ayon@avraan-dev:~ (zsh)</text>

  <g class="term-text">
    <text x="20" y="60">
      <tspan class="user">ayon@avraan</tspan><tspan class="host">:</tspan><tspan class="path">~</tspan><tspan class="cmd">$ whoami</tspan>
    </text>
    <text x="20" y="80" class="output">Sheikh Istiaque Mahmud Ayon</text>

