    </text>
    <text x="20" y="176" class="output">Flutter • Kotlin • Python • Dart • Android SDK</text>

    <text x="20" y="196">
      <tspan class="user">ayon@avraan</tspan><tspan class="host">:</tspan><tspan class="path">~</tspan><tspan class="cmd">$ </tspan>
    </text>
    <rect x="132" y="184" width="7" height="15" fill="#58A6FF" opacity="0.8" />
