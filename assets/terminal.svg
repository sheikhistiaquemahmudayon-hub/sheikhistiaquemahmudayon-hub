    </text>
    
    <text x="44" y="142">
      <tspan fill="#38BDF8">"role"</tspan><tspan fill="#64748B">:</tspan> <tspan fill="#E2E8F0">"Founder &amp; CEO @ Avraan"</tspan><tspan fill="#64748B">,</tspan>
    </text>
    
    <text x="44" y="166">
      <tspan fill="#38BDF8">"focus"</tspan><tspan fill="#64748B">:</tspan> <tspan fill="#E2E8F0">"Mobile Security &amp; Systems Architecture"</tspan><tspan fill="#64748B">,</tspan>
