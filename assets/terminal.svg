      <stop offset="0%" stop-color="#080C16" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
  </defs>

  <!-- Window Container -->
  <rect width="740" height="310" rx="10" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="1" />

