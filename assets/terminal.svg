<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 210" width="100%" height="100%">
  <style>
    .bg { fill: #0D1117; stroke: #30363D; stroke-width: 1; }
    .bar { fill: #161B22; }
    .title { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 12px; fill: #8B949E; }
    .term-text { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 13px; }
    .user { fill: #7EE787; font-weight: 600; }
    .host { fill: #8B949E; }
    .path { fill: #79C0FF; }
    .cmd { fill: #F0F6FC; }
