<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Background Base Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070C18" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Official Avraan Logo Gradient -->
    <linearGradient id="avraanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="40%" stop-color="#38BDF8" />
      <stop offset="70%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>

    <!-- Logo Radial Glow -->
    <radialGradient id="logoGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#070C18" stop-opacity="0" />
    </radialGradient>

    <!-- Subtle Grid Texture -->
    <pattern id="subtleGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1E293B" stroke-width="0.75" stroke-opacity="0.18" />
    </pattern>

    <!-- Official Avraan Hexagon Vector Logo (Matching avraan.png) -->
    <g id="avraan-official-logo">
      <polygon points="50,6 88,28 88,72 50,94 12,72 12,28" fill="#080E1A" stroke="url(#avraanGrad)" stroke-width="2.5" stroke-linejoin="round" />
      <path d="M 30 33 C 20 42, 21 61, 33 66 C 25 59, 26 46, 36 41 C 47 35, 59 52, 80 37 C 62 53, 45 62, 33 59 C 25 57, 24 44, 30 33 Z" fill="url(#avraanGrad)" opacity="0.95" />
      <path d="M 50 25 L 71 73 H 59 L 54 60 H 46 L 41 73 H 29 Z M 50 38 L 48 50 H 52 Z" fill="url(#avraanGrad)" />
    </g>
  </defs>

  <!-- Outer Container Card -->
  <rect width="400" height="400" rx="18" fill="url(#bgGrad)" stroke="#1E293B" stroke-opacity="0.6" stroke-width="1" />
  <rect width="400" height="400" rx="18" fill="url(#subtleGrid)" />

  <!-- Radial Background Glow -->
  <circle cx="200" cy="170" r="110" fill="url(#logoGlow)" />

  <!-- Accent Frame Ring -->
  <circle cx="200" cy="170" r="92" stroke="#1E293B" stroke-width="1" fill="none" opacity="0.6" />

  <!-- Centered Official Logo Group -->
  <g transform="translate(125, 95) scale(1.5)">
    <use href="#avraan-official-logo" />
  </g>

  <!-- Identity Typography -->
  <text x="200" y="308" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" letter-spacing="3" fill="#F8FAFC">AVRAAN</text>
  <text x="200" y="330" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" letter-spacing="0.5" fill="#94A3B8">MOBILE SECURITY &amp; AI</text>

  <!-- Status Indicator Dot -->
  <circle cx="360" cy="360" r="5" fill="#10B981" />
  <circle cx="360" cy="360" r="8" fill="none" stroke="#10B981" stroke-width="1" opacity="0.4" />
</svg>
