<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040712" />
      <stop offset="50%" stop-color="#070C1E" />
      <stop offset="100%" stop-color="#03050C" />
    </linearGradient>

    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="40%" stop-color="#38BDF8" />
      <stop offset="75%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>

    <radialGradient id="logoGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.3" />
      <stop offset="60%" stop-color="#6366F1" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#040712" stop-opacity="0" />
    </radialGradient>

    <pattern id="subtleGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1E293B" stroke-width="0.75" stroke-opacity="0.18" />
    </pattern>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <g id="avraan-official-logo">
      <path d="M 50 12 L 76 78 H 63 L 56 61 H 44 L 37 78 H 24 Z M 50 30 L 45 50 H 55 Z" fill="url(#neonGrad)" fill-rule="evenodd" />
      <path d="M 20 54 C 10 32, 28 16, 50 16 C 76 16, 90 36, 82 58 C 74 80, 46 86, 26 74 C 15 68, 14 54, 23 46 C 34 36, 66 34, 80 50 C 88 60, 78 74, 60 78 C 42 82, 22 72, 20 54 Z" fill="none" stroke="url(#neonGrad)" stroke-width="4.5" stroke-linecap="round" />
    </g>
  </defs>

  <rect width="400" height="400" rx="18" fill="url(#bgGrad)" stroke="url(#neonGrad)" stroke-width="1.5" stroke-opacity="0.6" />
  <rect width="400" height="400" rx="18" fill="url(#subtleGrid)" />

  <circle cx="200" cy="170" r="110" fill="url(#logoGlow)" />
  <circle cx="200" cy="170" r="92" stroke="url(#neonGrad)" stroke-width="3" fill="none" filter="url(#neonGlow)" />
  <circle cx="200" cy="170" r="84" stroke="#00F2FE" stroke-width="1" stroke-dasharray="6 4" fill="none" opacity="0.6" />

  <g transform="translate(125, 95) scale(1.5)">
    <use href="#avraan-official-logo" />
  </g>

  <text x="200" y="308" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" letter-spacing="4" fill="url(#neonGrad)">AVRAAN</text>
  <text x="200" y="330" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="1" fill="#94A3B8">MOBILE SECURITY &amp; AI</text>

  <circle cx="360" cy="360" r="5" fill="#10B981" />
  <circle cx="360" cy="360" r="8" fill="none" stroke="#10B981" stroke-width="1" opacity="0.4" />
</svg>
